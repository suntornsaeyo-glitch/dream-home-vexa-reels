name: Vexa Viral Thailand - Smart Product Manager V2
on:
  workflow_dispatch:
    inputs:
      allow_regenerate:
        description: 'Allow another paid preview on the same day'
        type: boolean
        default: false
      dry_run:
        description: "Skip paid image & voice generation (no MP4) — select true only for a free test"
        required: true
        type: boolean
        default: false
  schedule:
    - cron: '17 10 * * *' # Approx 17:17 Thailand; GitHub schedules may be delayed
permissions:
  contents: write
concurrency:
  group: vexa-viral-daily
  cancel-in-progress: false
jobs:
  make-reel:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
      FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
      ENABLE_PUBLISH: 'false' # HARD OFF during rebrand and QA
      FB_LIVE_APPROVED: 'false' # HARD OFF until Meta authorization and successful test
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
      ALLOW_REGENERATE: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_regenerate || false }}
      MONTHLY_SPEND_CAP_USD: ${{ vars.MONTHLY_SPEND_CAP_USD }}
      IMAGE_ESTIMATE_USD: ${{ vars.IMAGE_ESTIMATE_USD }}
      VOICE_ESTIMATE_USD: ${{ vars.VOICE_ESTIMATE_USD }}
      IMAGES_PER_REEL: ${{ vars.IMAGES_PER_REEL }}
      DAILY_SPEND_CAP_USD: ${{ vars.DAILY_SPEND_CAP_USD }}
      IMAGE_MODEL: gpt-image-1-mini
      VOICE_MODEL: gpt-4o-mini-tts
      VOICE_NAME: onyx
      USE_PAID_VOICE: 'true'
      ALLOW_FALLBACK_VOICE: 'false'
      GRAPH_VERSION: v27.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg espeak-ng fonts-dejavu-core fonts-thai-tlwg-ttf
          pip install -r requirements.txt
      - name: Verify Python syntax and affiliate rules (free)
        run: |
          python -m py_compile scripts/main.py scripts/affiliate.py scripts/settings.py admin/app.py admin/catalog.py admin/github_client.py
          python -m unittest discover -s tests -v
      - name: Produce Thai MP4 and affiliate-ready caption (Facebook disabled)
        run: python scripts/main.py
      - name: Commit estimate guard and successful publication state
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/state.json
          git diff --cached --quiet || (git commit -m 'Update Vexa budget state' && git pull --rebase && git push)
      - name: Upload preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vexa-viral-preview-${{ github.run_id }}
          path: output/
          retention-days: 7
          if-no-files-found: ignore
