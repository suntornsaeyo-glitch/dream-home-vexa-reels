name: Dream Home Vexa V2 Premium Reels
on:
  workflow_dispatch:
  schedule:
    - cron: '17 10 * * *' # Approx 17:17 Thailand; GitHub schedules may be delayed
permissions:
  contents: write
concurrency:
  group: dream-home-vexa-daily
  cancel-in-progress: false
jobs:
  make-reel:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
      FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
      ENABLE_PUBLISH: ${{ vars.ENABLE_PUBLISH || 'false' }}
      FB_LIVE_APPROVED: ${{ vars.FB_LIVE_APPROVED || 'false' }}
      MONTHLY_SPEND_CAP_USD: ${{ vars.MONTHLY_SPEND_CAP_USD || '5.00' }}
      IMAGE_ESTIMATE_USD: ${{ vars.IMAGE_ESTIMATE_USD || '0.12' }}
      VOICE_ESTIMATE_USD: ${{ vars.VOICE_ESTIMATE_USD || '0.05' }}
      IMAGES_PER_REEL: ${{ vars.IMAGES_PER_REEL || '3' }}
      IMAGE_MODEL: gpt-image-1-mini
      VOICE_MODEL: gpt-4o-mini-tts
      VOICE_NAME: onyx
      USE_PAID_VOICE: 'true'
      ALLOW_FALLBACK_VOICE: 'false'
      GRAPH_VERSION: v27.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg espeak-ng fonts-dejavu-core
          pip install -r requirements.txt
      - name: Create premium Reel, optionally publish
        run: python scripts/main.py
      - name: Commit estimate guard and successful publication state
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/state.json
          git diff --cached --quiet || (git commit -m 'Update Vexa budget state' && git pull --rebase && git push)
      - name: Upload preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dream-home-vexa-v2-${{ github.run_id }}
          path: output/
          retention-days: 7
          if-no-files-found: ignore
