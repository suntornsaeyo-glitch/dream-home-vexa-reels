name: Smart Product Manager V2 offline checks
on:
  workflow_dispatch:
  push:
    paths:
      - 'admin/**'
      - 'scripts/**'
      - 'data/settings.json'
      - 'tests/**'
      - 'requirements-admin.txt'
      - '.github/workflows/admin-check.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements-admin.txt
      - run: python -m compileall -q admin scripts tests
      - run: python -m unittest discover -s tests -v
      - run: python -m unittest discover -s admin/tests -v
      - run: DRY_RUN=true ENABLE_PUBLISH=false FB_LIVE_APPROVED=false python scripts/main.py
